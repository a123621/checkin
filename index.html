<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>我的打卡</title>
<style>
  /* ==================== ① 基础与变量 ==================== */
  :root {
    --theme-rgb: 255, 107, 129;
    --theme-alpha: 0.85;
    --theme: rgba(var(--theme-rgb), var(--theme-alpha));
    --theme-solid: rgb(var(--theme-rgb));
    --theme-soft: rgba(var(--theme-rgb), 0.15);
    --theme-glow: rgba(var(--theme-rgb), 0.4);
    --bg-dim: 0.25;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --dot-off: rgba(255, 255, 255, 0.3);
    --radius-lg: 24px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    background-color: #1a1a1a;
    display: flex; flex-direction: column; height: 100dvh; position: relative;
    transition: color 0.3s;
  }

  /* 背景层 */
  .bg-layer {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    background-size: cover; background-position: center;
    transition: background-image 0.3s ease, opacity 0.3s ease;
    background-repeat: no-repeat;
  }
  .bg-dim {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    background: rgba(0,0,0, var(--bg-dim)); pointer-events: none;
    transition: background 0.3s;
  }

  /* ==================== ② 布局骨架 ==================== */
  #app {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    height: 100%; width: 100%; max-width: 480px; margin: 0 auto;
  }

  /* 顶部导航 */
  .top-nav {
    padding-top: env(safe-area-inset-top);
    padding: 16px 20px 10px;
    display: flex; justify-content: flex-end; align-items: center;
    position: relative;
  }
  .menu-btn {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer; background: rgba(255,255,255,0.1);
    border-radius: 50%; border: none; color: var(--text-primary);
    transition: background 0.2s;
  }
  .menu-btn:active { background: rgba(255,255,255,0.25); }

  /* 视图切换 */
  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* 首页时间排版 */
  .home-header { text-align: center; padding: 10px 20px 30px; }
  #live-time {
    font-size: 56px; font-weight: 300; letter-spacing: 2px;
    font-variant-numeric: tabular-nums; line-height: 1.1;
    text-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .poem {
    font-size: 15px; font-style: italic; color: var(--text-secondary);
    margin-top: 8px; font-weight: 300; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* 首页导航字 */
  .home-nav {
    display: flex; justify-content: center; align-items: center; gap: 16px;
    padding: 10px 0 20px;
  }
  .nav-text {
    font-size: 18px; cursor: pointer; padding: 8px 12px;
    transition: transform 0.2s, color 0.2s;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4); border-radius: 12px;
  }
  .nav-text:active { transform: scale(0.92); }
  .nav-text.active { color: var(--theme-solid); }

  /* 内容区 */
  .content-area { flex: 1; overflow-y: auto; padding: 0 16px 16px; position: relative; }

  /* 功能页顶部导航 */
  .func-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; font-size: 16px; font-weight: 600;
  }
  .back-btn {
    background: rgba(255,255,255,0.1); border: none; color: var(--text-primary);
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.3); }

  /* ==================== ③ 日历卡片 ==================== */
  .calendar-card {
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    margin: 0 auto 16px;
    width: 100%; max-width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .calendar-card:active { transform: scale(0.98); }

  .cal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; padding: 0 4px;
  }
  .cal-header span { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
  .cal-header button {
    background: none; border: none; color: var(--text-primary);
    font-size: 18px; padding: 4px 8px; cursor: pointer;
    border-radius: 8px;
  }
  .cal-header button:active { background: rgba(255,255,255,0.2); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-week { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  
  .cal-day {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 38px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-variant-numeric: tabular-nums;
    position: relative; transition: background 0.2s;
  }
  .cal-day:active { background: rgba(255,255,255,0.15); }
  .cal-day.not-month { opacity: 0.25; pointer-events: none; }
  .cal-day.today { border: 1.5px solid var(--theme-solid); }
  .cal-day.selected { background: var(--theme-solid); color: #fff; }
  
  .dots { display: flex; gap: 2px; height: 5px; margin-top: 1px; align-items: center; justify-content: center; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--dot-off); }
  .dot.active { background: var(--theme-solid); }
  .dot.active.selected { background: #fff; }

  /* ==================== ④ 记录列表 ==================== */
  .record-card {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .record-card h3 { font-size: 15px; margin-bottom: 12px; font-weight: 500; }

  .record-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
  }
  .record-item:last-child { border-bottom: none; }
  .record-left { display: flex; align-items: center; gap: 8px; flex: 1; }
  .record-name { font-weight: 400; }
  .record-right { display: flex; align-items: center; gap: 8px; }
  .record-val { font-weight: 600; color: var(--theme-solid); }
  .record-del {
    background: rgba(255,255,255,0.1); border: none; color: var(--text-secondary);
    padding: 2px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
  }
  .record-del:active { background: #ff3b30; color: #fff; }

  .total-row {
    display: flex; justify-content: space-between; margin-top: 10px;
    padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2);
    font-weight: 600; color: var(--theme-solid); font-size: 15px;
  }
  .sub-total { font-size: 12px; color: var(--text-secondary); text-align: right; margin-top: 2px; }

  /* ==================== ⑤ 可拖动悬浮按钮 ==================== */
  .fab {
    position: absolute; right: 20px; bottom: 20px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--theme-solid); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 300;
    box-shadow: 0 4px 16px var(--theme-glow);
    border: none; cursor: pointer; z-index: 50;
    touch-action: none; /* 允许拖动 */
    user-select: none;
    transition: transform 0.1s;
  }
  .fab:active { transform: scale(0.95); }

  /* ==================== ⑥ 侧边栏（设置） ==================== */
  #settings-panel {
    position: fixed; top: 0; right: 0; width: 300px; height: 100%;
    z-index: 300; background: rgba(25, 25, 28, 0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex; flex-direction: column; padding: 24px; padding-top: env(safe-area-inset-top);
    overflow-y: auto;
  }
  #settings-panel.open { transform: translateX(0); }
  .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .settings-header h2 { font-size: 18px; color: #fff; }
  .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }

  .setting-item { margin-bottom: 20px; }
  .setting-item label { display: block; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
  .setting-item input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; }
  .setting-item input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 8px; background: none; cursor: pointer; }
  .setting-item input[type="range"] { width: 100%; accent-color: var(--theme-solid); }
  .btn-block { width: 100%; padding: 12px; background: var(--theme-solid); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .btn-secondary { background: rgba(255,255,255,0.12); color: #fff; }

  /* ==================== ⑦ 其他 ==================== */
  .view-switch-overlay {
    position: fixed; inset: 0; background: #1a1a1a; z-index: 100;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  ::-webkit-scrollbar { display: none; }
</style>
</head>

<script>
// ==================== ① CONFIG ====================
const STORAGE_KEYS = {
  settings: 'ck_settings_v1',
  records: 'ck_records_v1',
  suggest: 'ck_suggest_v1',
  bg: 'ck_bg_v1'
};

// ==================== ② Util ====================
const Util = {
  formatDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },
  parseDateKey(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  },
  getWeekRange(dateStr) {
    const d = this.parseDateKey(dateStr);
    const day = d.getDay() || 7;
    const monday = new Date(d);
    monday.setDate(d.getDate() - day + 1);
    const range = [];
    for (let i = 0; i < 7; i++) {
      const dd = new Date(monday);
      dd.setDate(monday.getDate() + i);
      range.push(this.formatDateKey(dd));
    }
    return range;
  },
  formatMoney(n) { return '¥' + n.toFixed(2); }
};

// ==================== ③ Store ====================
const Store = {
  data: { records: { sport: {}, shopping: {}, diet: {} }, suggest: { sport: {}, shopping: {}, diet: {} } },
  
  load() {
    try {
      const rec = localStorage.getItem(STORAGE_KEYS.records);
      if (rec) this.data.records = JSON.parse(rec);
    } catch (e) { console.error('加载数据失败', e); }
  },
  
  saveRecords() {
    try { localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(this.data.records)); } catch (e) { alert('存储空间不足'); }
  },
  
  addRecord(module, dateKey, record) {
    if (!this.data.records[module][dateKey]) this.data.records[module][dateKey] = [];
    this.data.records[module][dateKey].push(record);
    this.saveRecords();
  },
  
  deleteRecord(module, dateKey, id) {
    const list = this.data.records[module][dateKey];
    if (!list) return;
    const idx = list.findIndex(r => r.id === id);
    if (idx > -1) {
      list.splice(idx, 1);
      if (list.length === 0) delete this.data.records[module][dateKey];
      this.saveRecords();
    }
  }
};

// ==================== ④ Theme ====================
const Theme = {
  settings: { themeRGB: '255, 107, 129', themeAlpha: 0.85, bgDim: 0.25 },
  
  load() {
    try {
      const s = localStorage.getItem(STORAGE_KEYS.settings);
      if (s) this.settings = { ...this.settings, ...JSON.parse(s) };
    } catch(e) {}
    this.apply();
  },
  
  save() {
    try { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(this.settings)); } catch(e) {}
  },
  
  apply() {
    const root = document.documentElement.style;
    root.setProperty('--theme-rgb', this.settings.themeRGB);
    root.setProperty('--theme-alpha', this.settings.themeAlpha);
    root.setProperty('--bg-dim', this.settings.bgDim);
  },
  
  setThemeFromHex(hex) {
    const rgb = this.hexToRgb(hex);
    if (rgb) {
      this.settings.themeRGB = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
      this.apply(); this.save();
    }
  },
  
  hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
  },
  
  rgbToHex(rgbStr) {
    const [r, g, b] = rgbStr.split(',').map(n => parseInt(n.trim()));
    return '#' + [r, g, b].map(n => n.toString(16).padStart(2, '0')).join('');
  }
};

// ==================== ⑤ Background ====================
const Background = {
  bgs: { home: '', sport: '', shopping: '', diet: '' },
  currentView: 'home',
  
  load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEYS.bg);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (typeof parsed === 'string') { this.bgs.home = parsed; } // 兼容旧数据
        else { this.bgs = { ...this.bgs, ...parsed }; }
      }
    } catch(e) {}
    this.applyBg();
  },
  
  save() {
    try { localStorage.setItem(STORAGE_KEYS.bg, JSON.stringify(this.bgs)); } catch(e) { alert('壁纸太大，保存失败'); }
  },
  
  applyBg() {
    const bg = this.bgs[this.currentView] || '';
    document.getElementById('bg-layer').style.backgroundImage = bg ? `url(${bg})` : '';
  },
  
  setBg(view, dataURL) {
    this.bgs[view] = dataURL;
    this.save();
    this.applyBg();
  }
};

// ==================== ⑥ Calendar ====================
const Calendar = {
  currentMonth: new Date(),
  selectedDate: Util.formatDateKey(new Date()),
  
  init() { this.renderAll(); },
  
  changeMonth(delta) {
    this.currentMonth.setMonth(this.currentMonth.getMonth() + delta);
    this.renderAll();
  },
  
  renderAll() {
    ['home', 'sport', 'shopping', 'diet'].forEach(v => this.renderGrid(v));
    App.updateDietStat();
    App.refreshRecords();
  },
  
  renderGrid(viewId) {
    const y = this.currentMonth.getFullYear();
    const m = this.currentMonth.getMonth();
    const label = document.getElementById('cal-month-label-' + viewId);
    if (label) label.innerText = `${y}年${m + 1}月`;
    
    const firstDay = new Date(y, m, 1);
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let startDay = firstDay.getDay();
    startDay = startDay === 0 ? 7 : startDay;
    
    const grid = document.getElementById('cal-days-' + viewId);
    if (!grid) return;
    grid.innerHTML = '';
    const fragment = document.createDocumentFragment();
    
    for (let i = 1; i < startDay; i++) {
      const div = document.createElement('div'); div.className = 'cal-day not-month'; fragment.appendChild(div);
    }
    
    const todayStr = Util.formatDateKey(new Date());
    
    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const div = document.createElement('div');
      div.className = 'cal-day';
      if (dateKey === todayStr) div.classList.add('today');
      if (dateKey === this.selectedDate) div.classList.add('selected');
      
      const num = document.createElement('span'); num.innerText = d; div.appendChild(num);
      
      const dotsDiv = document.createElement('div'); dotsDiv.className = 'dots';
      const hasSport = Store.data.records.sport[dateKey] && Store.data.records.sport[dateKey].length > 0;
      const hasShop = Store.data.records.shopping[dateKey] && Store.data.records.shopping[dateKey].length > 0;
      const hasDiet = Store.data.records.diet[dateKey] && Store.data.records.diet[dateKey].length > 0;
      
      if (hasSport || hasShop || hasDiet) {
        if (hasSport) dotsDiv.appendChild(this.makeDot(dateKey === this.selectedDate));
        if (hasShop) dotsDiv.appendChild(this.makeDot(dateKey === this.selectedDate));
        if (hasDiet) dotsDiv.appendChild(this.makeDot(dateKey === this.selectedDate));
      } else {
        dotsDiv.appendChild(this.makeDot(false, true));
      }
      div.appendChild(dotsDiv);
      
      // 点击数字：只更新选中日期，不换背景
      div.onclick = (e) => {
        e.stopPropagation(); // 阻止冒泡到日历卡片的换背景
        this.selectedDate = dateKey;
        this.renderAll();
      };
      
      fragment.appendChild(div);
    }
    
    grid.appendChild(fragment);
  },
  
  makeDot(isSelected, isOff = false) {
    const dt = document.createElement('div');
    dt.className = 'dot' + (isOff ? '' : ' active') + (isSelected ? ' selected' : '');
    return dt;
  }
};

// ==================== ⑦ App ====================
const App = {
  currentView: 'home',
  dragState: { active: false, startX: 0, startY: 0, initialLeft: 0, initialTop: 0, moved: false },
  
  init() {
    Theme.load();
    Store.load();
    Background.load();
    Calendar.init();
    this.startClock();
    this.bindEvents();
    this.refreshRecords();
  },
  
  startClock() {
    const update = () => {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('live-time').innerText = `${h}:${m}`;
    };
    update();
    setInterval(update, 1000);
  },
  
  bindEvents() {
    // 主题色修改
    document.getElementById('theme-hex-input').addEventListener('input', (e) => {
      Theme.setThemeFromHex(e.target.value);
      document.getElementById('theme-color-picker').value = e.target.value;
    });
    document.getElementById('theme-color-picker').addEventListener('input', (e) => {
      Theme.setThemeFromHex(e.target.value);
      document.getElementById('theme-hex-input').value = e.target.value;
    });
    // 压暗滑块
    document.getElementById('bg-dim-slider').addEventListener('input', (e) => {
      Theme.settings.bgDim = parseFloat(e.target.value);
      Theme.apply(); Theme.save();
    });
    // 侧边栏上传壁纸
    document.getElementById('bg-upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataURL = await this.compressImage(file);
        Background.setBg(this.currentView, dataURL);
        alert('壁纸已更新！');
      } catch (err) { alert('图片处理失败'); }
      e.target.value = '';
    });
    // 导入
    document.getElementById('import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.records) { Store.data.records = data.records; Store.saveRecords(); }
          alert('数据导入成功！');
          Calendar.renderAll();
        } catch (err) { alert('文件格式错误'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
  },
  
  // 拖动功能
  startDrag(e) {
    const fab = e.currentTarget;
    const rect = fab.getBoundingClientRect();
    this.dragState = {
      active: true, startX: e.clientX, startY: e.clientY,
      initialLeft: rect.left, initialTop: rect.top, moved: false
    };
    fab.setPointerCapture(e.pointerId);
    
    const onMove = (ev) => {
      if (!this.dragState.active) return;
      const dx = ev.clientX - this.dragState.startX;
      const dy = ev.clientY - this.dragState.startY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) this.dragState.moved = true;
      
      fab.style.left = (this.dragState.initialLeft + dx) + 'px';
      fab.style.top = (this.dragState.initialTop + dy) + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
      fab.style.position = 'fixed';
    };
    
    const onUp = () => {
      this.dragState.active = false;
      fab.removeEventListener('pointermove', onMove);
      fab.removeEventListener('pointerup', onUp);
    };
    
    fab.addEventListener('pointermove', onMove);
    fab.addEventListener('pointerup', onUp);
  },
  
  switchView(view) {
    this.currentView = view;
    // 更新背景
    Background.applyBg();
    
    // 切换视图
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
    
    // 同步主题色到设置面板
    document.getElementById('theme-hex-input').value = Theme.rgbToHex(Theme.settings.themeRGB);
    document.getElementById('theme-color-picker').value = Theme.rgbToHex(Theme.settings.themeRGB);
    
    this.refreshRecords();
  },
  
  toggleSettings() {
    document.getElementById('settings-panel').classList.toggle('open');
  },
  
  changeMonth(delta) { Calendar.changeMonth(delta); },
  
  changeBg(view) {
    this.currentView = view;
    document.getElementById('bg-upload').click();
  },
  
  compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          let w = img.width, h = img.height;
          const maxDim = 1280;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          let quality = 0.75;
          let dataURL = canvas.toDataURL('image/jpeg', quality);
          while (dataURL.length > 320000 && quality > 0.4) {
            quality -= 0.1;
            dataURL = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataURL);
        };
        img.onerror = reject;
      };
      reader.onerror = reject;
    });
  },
  
  updateDietStat() {
    const monthKey = Calendar.selectedDate.substring(0, 7);
    let drinkCount = 0;
    Object.keys(Store.data.records.diet).forEach(date => {
      if (date.startsWith(monthKey)) {
        Store.data.records.diet[date].forEach(item => {
          if (item.cat === 'drink') drinkCount++;
        });
      }
    });
    document.getElementById('diet-month-stat').innerText = `本月饮料 ${drinkCount} 次`;
  },
  
  refreshRecords() {
    const date = Calendar.selectedDate;
    const title = this.formatTitle(date);
    
    // 运动
    document.getElementById('sport-date-title').innerText = title;
    const sportList = Store.data.records.sport[date] || [];
    let sportHtml = '', sportDay = 0;
    sportList.forEach(item => {
      sportDay += item.kcal;
      sportHtml += `<div class="record-item"><div class="record-left"><span class="record-name">${item.name}</span></div><div class="record-right"><span class="record-val">${item.kcal} kcal</span><button class="record-del" onclick="App.deleteRecord('sport','${date}','${item.id}')">删</button></div></div>`;
    });
    document.getElementById('sport-list').innerHTML = sportHtml || '<div style="text-align:center;color:var(--text-secondary);padding:16px 0;font-size:13px;">这天还没有运动记录</div>';
    document.getElementById('sport-day-total').innerText = `${sportDay} kcal`;
    
    const weekRange = Util.getWeekRange(date);
    let sportWeek = 0;
    weekRange.forEach(d => { (Store.data.records.sport[d] || []).forEach(r => sportWeek += r.kcal); });
    document.getElementById('sport-week-total').innerText = `本周合计: ${sportWeek} kcal`;
    
    // 购物
    document.getElementById('shopping-date-title').innerText = title;
    const shopList = Store.data.records.shopping[date] || [];
    let shopHtml = '', shopDay = 0;
    shopList.forEach(item => {
      shopDay += item.price;
      shopHtml += `<div class="record-item"><div class="record-left"><span class="record-name">${item.name}</span></div><div class="record-right"><span class="record-val">${Util.formatMoney(item.price)}</span><button class="record-del" onclick="App.deleteRecord('shopping','${date}','${item.id}')">删</button></div></div>`;
    });
    document.getElementById('shopping-list').innerHTML = shopHtml || '<div style="text-align:center;color:var(--text-secondary);padding:16px 0;font-size:13px;">这天还没有购物记录</div>';
    document.getElementById('shopping-day-total').innerText = Util.formatMoney(shopDay);
    
    // 饮食
    document.getElementById('diet-date-title').innerText = title;
    const dietList = Store.data.records.diet[date] || [];
    let dietHtml = '', dietDay = 0;
    const catColors = { meal: '#4CAF7D', snack: '#F0A030', drink: '#4A9BE8', feast: '#E05C5C' };
    dietList.forEach(item => {
      dietDay += item.price;
      const color = catColors[item.cat] || catColors.meal;
      dietHtml += `<div class="record-item"><div class="record-left"><div style="width:3px;height:16px;border-radius:2px;background:${color};margin-right:8px;"></div><span class="record-name">${item.name}</span></div><div class="record-right"><span class="record-val">${Util.formatMoney(item.price)}</span><button class="record-del" onclick="App.deleteRecord('diet','${date}','${item.id}')">删</button></div></div>`;
    });
    document.getElementById('diet-list').innerHTML = dietHtml || '<div style="text-align:center;color:var(--text-secondary);padding:16px 0;font-size:13px;">这天还没有饮食记录</div>';
    document.getElementById('diet-day-total').innerText = Util.formatMoney(dietDay);
    
    let dietWeek = 0;
    weekRange.forEach(d => { (Store.data.records.diet[d] || []).forEach(r => dietWeek += r.price); });
    document.getElementById('diet-week-total').innerText = `本周合计: ${Util.formatMoney(dietWeek)}`;
  },
  
  formatTitle(dateStr) {
    const d = Util.parseDateKey(dateStr);
    const weeks = ['周日','周一','周二','周三','周四','周五','周六'];
    return `${d.getMonth()+1}月${d.getDate()}日 ${weeks[d.getDay()]}`;
  },
  
  deleteRecord(module, date, id) {
    if (confirm('确定删除这条记录吗？')) {
      Store.deleteRecord(module, date, id);
      Calendar.renderAll(); // 刷新日历和列表
    }
  },
  
  openSheet(module) {
    alert('记录功能将在下一版本加入！');
  },
  
  exportData() {
    const data = { records: Store.data.records };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `打卡备份_${Util.formatDateKey(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
};

// ==================== 启动 ====================
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
